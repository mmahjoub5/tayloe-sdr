[project]
name = "radiolib"
version = "0.1.0"
description = "Host-side library for the Tayloe receiver board"
requires-python = ">=3.9"
dependencies = ["ldpc", "numpy", "pyserial", "scipy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["radiolib*"]

[tool.setuptools.package-data]
radiolib = ["ft8/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
